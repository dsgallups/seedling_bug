[package]
name = "seedling_bug"
version = "0.1.0"
edition = "2024"


[dependencies]
bevy = { version = "0.17", default-features = false, features = [
    "animation",
    "async_executor",
    "bevy_asset",
    "bevy_animation",
    "bevy_anti_alias",
    "bevy_color",
    "bevy_camera",
    "bevy_core_pipeline",
     # "bevy_gilrs",
    "bevy_gltf",
    "bevy_gizmos",
    "bevy_image",
    "bevy_input_focus",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_mesh_picking_backend",
    "bevy_pbr",
    "bevy_picking",
    "bevy_post_process",
    "bevy_render",
    "bevy_scene",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_sprite_picking_backend",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_picking_backend",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "custom_cursor",
    "default_font",
    # "experimental_pbr_pcss",
    "experimental_bevy_feathers",
    "hdr",
    #"ktx2",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "serialize",
    "std",
    #"smaa_luts",
    "sysinfo_plugin",
    # everything turns pink without this feature
    "tonemapping_luts",
    #"webgl2",
    "wayland",
    "zstd_rust",
] }
bevy_seedling = { version = "0.6.0" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments, which would undesirably trigger this lint.
too_many_arguments = "allow"
# Queries may access many components, which would undesirably trigger this lint.
type_complexity = "allow"
# Make sure macros use their standard braces, such as `[]` for `bevy_ecs::children!`.
nonstandard_macro_braces = "warn"
double-parens = "allow"


[patch.crates-io]
bevy_seedling = { git = "https://github.com/corvusprudens/bevy_seedling", branch = "v0.6.0" }
firewheel = { git = "https://github.com/BillyDM/firewheel" }
